%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/nuvoton,ma35d1-eadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 EADC controller

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

description: Nuvoton MA35D1 enhanced ADC controller.

properties:
  compatible:
    const: nuvoton,ma35d1-eadc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: eadc_gate

  eadc-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: EADC clock frequency in Hz.
    minimum: 1

  eadc-channels:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Single-ended EADC input channel numbers.
    minItems: 1
    maxItems: 8
    items:
      minimum: 0
      maximum: 7

  eadc-diff-channels:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Differential EADC channels as positive/negative pairs.
    minItems: 2
    maxItems: 16
    items:
      minimum: 0
      maximum: 7

  dmas:
    maxItems: 1

  dma-names:
    const: rx

  use_pdma:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  pdma_reqsel_rx:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 255


required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - eadc-frequency

unevaluatedProperties: false

examples:
  - |
    eadc@40430000 {
      compatible = "nuvoton,ma35d1-eadc";
      reg = <0x0 0x40430000 0x0 0x10000>;
      interrupts = <GIC_SPI 65 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clk EADC_GATE>;
      clock-names = "eadc_gate";
      eadc-frequency = <10000000>;
      eadc-channels = <0 1 2 3 4 5 6 7>;
    };
