%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nuvoton,ma35d1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 Series I2S Controller

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

description: |
  The Nuvoton MA35D0, MA35D1 and MA35H0 I2S controllers provide serial
  audio interfaces for external codecs. The current driver supports
  full-duplex mono and stereo playback/capture, I2S, left-justified and
  right-justified formats, master and slave modes, and DMAengine PCM.

  The controller supplies the CPU DAI and the DMA interface. Audio
  connections, codec selection, and board-level clock policy are
  described by the sound card, normally using simple-audio-card.

allOf:
  - $ref: dai-common.yaml#
  - oneOf:
      - required:
          - nuvoton,pdma-reqsel-tx
        not:
          required:
            - pdma_reqsel_tx
      - required:
          - pdma_reqsel_tx
        not:
          required:
            - nuvoton,pdma-reqsel-tx
  - oneOf:
      - required:
          - nuvoton,pdma-reqsel-rx
        not:
          required:
            - pdma_reqsel_rx
      - required:
          - pdma_reqsel_rx
        not:
          required:
            - nuvoton,pdma-reqsel-rx

properties:
  compatible:
    enum:
      - nuvoton,ma35d0-i2s
      - nuvoton,ma35d1-i2s
      - nuvoton,ma35h0-i2s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: I2S peripheral clock supplied by the MA35 clock controller.

  resets:
    maxItems: 1
    description: Optional reset control for the I2S controller.

  dmas:
    minItems: 2
    maxItems: 2
    description: DMA channels for playback and capture, respectively.

  dma-names:
    items:
      - const: tx
      - const: rx

  nuvoton,pdma-reqsel-tx:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [86, 88]
    description: |
      MA35 PDMA hardware request selector for I2S transmission.
      I2S0 uses request 86 and I2S1 uses request 88.

  nuvoton,pdma-reqsel-rx:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [87, 89]
    description: |
      MA35 PDMA hardware request selector for I2S reception.
      I2S0 uses request 87 and I2S1 uses request 89.

  pdma_reqsel_tx:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [86, 88]
    deprecated: true
    description: Legacy alias for nuvoton,pdma-reqsel-tx.

  pdma_reqsel_rx:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [87, 89]
    deprecated: true
    description: Legacy alias for nuvoton,pdma-reqsel-rx.

  mclk_out:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    deprecated: true
    description: |
      Legacy requested MCLK frequency in Hz. When absent, the driver
      defaults to 12 MHz. A generic sound card may override the request
      through the CPU DAI set_sysclk() operation. New board descriptions
      should use the standard sound-card clock properties instead.

  powerdown-gpios:
    maxItems: 1
    deprecated: true
    description: |
      Legacy board-level external audio-path power-down control.
      The asserted state powers down the external audio path. New board
      designs should describe codec supplies and power controls using
      the appropriate codec or board-level bindings.

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - dmas
  - dma-names
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>
    #include <dt-bindings/dma/nuvoton,ma35-pdma.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/nuvoton,ma35d1-reset.h>

    i2s@40480000 {
        compatible = "nuvoton,ma35d1-i2s";
        reg = <0x40480000 0x10000>;
        interrupts = <GIC_SPI 70 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk I2S0_GATE>;
        resets = <&reset MA35D1_RESET_I2S0>;

        dmas = <&pdma0 0>, <&pdma0 1>;
        dma-names = "tx", "rx";
        nuvoton,pdma-reqsel-tx = <MA35_PDMA_REQ_I2S0_TX>;
        nuvoton,pdma-reqsel-rx = <MA35_PDMA_REQ_I2S0_RX>;

        #sound-dai-cells = <0>;
    };
...
