%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/nuvoton,ma35d1-tsen.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 Temperature Sensor

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

description:
  Temperature sensor for Nuvoton MA35D1, MA35D0 and MA35H0 SoCs. The
  sensor registers are located in the system controller register block.

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-tsen
      - nuvoton,ma35d0-tsen
      - nuvoton,ma35h0-tsen

  nuvoton,ma35d0-sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the MA35D0 system controller.

  nuvoton,ma35d1-sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the MA35 system controller syscon register block.

  nuvoton,ma35h0-sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the MA35H0 system controller.

  "#thermal-sensor-cells":
    const: 0

required:
  - compatible
  - "#thermal-sensor-cells"

anyOf:
  - required: ["nuvoton,ma35d0-sys"]
  - required: ["nuvoton,ma35d1-sys"]
  - required: ["nuvoton,ma35h0-sys"]

additionalProperties: false

examples:
  - |
    temperature-sensor {
        compatible = "nuvoton,ma35d1-tsen";
        nuvoton,ma35d1-sys = <&sys>;
        #thermal-sensor-cells = <0>;
    };
...
